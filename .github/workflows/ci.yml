name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Hermes
        run: pip install hermes-agent

      - name: Python syntax check
        run: python -m py_compile __init__.py checks.py constants.py

      - name: Type check
        run: |
          pip install mypy types-PyYAML
          # mypy rejects the hyphenated `hermes-guide` dir as a package name;
          # typecheck the modules under a valid package name.
          mkdir -p /tmp/hermes_guide
          cp __init__.py checks.py constants.py /tmp/hermes_guide/
          mypy /tmp/hermes_guide

      - name: Plugin doctor
        run: hermes plugins doctor . --ci
