name: upstream-drift-check

on:
  schedule:
    # Mondays 06:00 UTC (13:00 Asia/Jakarta)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check upstream schema drift
        run: python3 tools/check_upstream_drift.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: NousResearch/hermes-agent
          WATCH_FILES: hermes_cli/plugins.py tools/skills_tool.py agent/skill_utils.py skills/autonomous-ai-agents/hermes-agent
