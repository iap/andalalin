[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
# The Hermes plugin API is loosely typed: `ctx` is passed in, and check
# envelopes are heterogeneous dicts. Requiring full annotations would add noise
# without value at this size; enable stricter flags later if desired.
disallow_untyped_defs = false
